[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minicheck"
version = "0.2.0"
description = "An explicit-state model checker in ~560 lines. Shortest counterexamples, no required dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["model-checking", "formal-methods", "verification", "counterexample", "invariant", "k-induction"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
smt = ["z3-solver>=4.12"]
test = ["pytest>=7"]

[project.scripts]
minicheck = "minicheck.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
