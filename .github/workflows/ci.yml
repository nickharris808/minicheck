name: ci
on:
  push: {branches: [main]}
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ruff==0.14.2
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - {os: macos-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,smt]"
      - name: Test
        shell: bash
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  # Install the package ALONE, exactly as a stranger would, with nothing pre-installed and no
  # editable mode. This is the job that catches an unresolvable dependency: `pip install -e .` in
  # the `test` job above resolves the source tree first, so a dependency that 404s on PyPI stays
  # invisible there. That is how a package whose only dependency is unpublished shipped green.
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install from a built wheel into a fresh environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --upgrade pip
          /tmp/fresh/bin/pip install .
      - name: Import it outside the source tree
        run: cd /tmp && /tmp/fresh/bin/python -c "import minicheck; print(minicheck.__name__, 'imported')"
